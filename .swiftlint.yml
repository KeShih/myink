included:
  - Sources
  - Tests

disabled_rules:
  - todo
  - trailing_comma
  - nesting
  - opening_brace
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  - identifier_name
  - type_name
  - force_cast
  - multiple_closures_with_trailing_closure
  - statement_position # needs SourceKit, which CLT-only installs can't load

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true
